name: Build ACE APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build ACE APK
        working-directory: ACE-Android
        run: gradle assembleDebug

      - name: Upload ACE APK
        uses: actions/upload-artifact@v4
        with:
          name: ACE-debug-apk
          path: ACE-Android/app/build/outputs/apk/debug/app-debug.apk
